<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Felsic Crystal Gradient: Aquamarine / Cyan -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="lightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Note Document Base -->
  <path d="M 144 112 h 144 l 80 80 v 192 a 16 16 0 0 1 -16 16 h -208 a 16 16 0 0 1 -16 -16 v -256 a 16 16 0 0 1 16 -16 z" fill="url(#paperGrad)" filter="url(#lightShadow)"/>
  
  <!-- Document Fold -->
  <path d="M 288 112 v 64 a 16 16 0 0 0 16 16 h 64 Z" fill="#CBD5E0"/>

  <!-- Text lines -->
  <rect x="176" y="240" width="80" height="16" rx="8" fill="#94A3B8" />
  <rect x="176" y="288" width="160" height="16" rx="8" fill="#94A3B8" />
  <rect x="176" y="336" width="120" height="16" rx="8" fill="#94A3B8" />

  <!-- Felsic Crystal Icon -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Base diamond shape -->
    <path d="M 256 160 l 64 80 l -64 128 l -64 -128 z" fill="url(#crystalGrad)"/>
    <!-- Top Right Facet -->
    <path d="M 256 160 l 64 80 l -64 24 z" fill="#FFFFFF" opacity="0.4"/>
    <!-- Top Left Facet -->
    <path d="M 256 160 l -64 80 l 64 24 z" fill="#FFFFFF" opacity="0.15"/>
    <!-- Bottom Right Facet -->
    <path d="M 256 368 l 64 -128 l -64 24 z" fill="#000000" opacity="0.2"/>
    <!-- Bottom Left Facet -->
    <path d="M 256 368 l -64 -128 l 64 24 z" fill="#000000" opacity="0.05"/>
  </g>
</svg>
